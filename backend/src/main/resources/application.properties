
# Application
spring.application.name=backend

# Load optional local environment configuration
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Database
spring.datasource.url=${DB_URL:${DATABASE_URL}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD}}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Display SQL queries during development
spring.jpa.show-sql=true
